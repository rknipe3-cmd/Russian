<title>Русский: Crash Course</title>

<style>
:root{--bg:#f5f5f0;--bg-card:#fff;--text:#1a1a1a;--text-muted:#6b6b6b;--accent:#1a472a;--border:#e8e8e4}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--bg-card:#1e1e1e;--text:#e8e8e4;--text-muted:#8a8a8a;--accent:#6dba82;--border:#2a2a2a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;-webkit-appearance:none}
#root{max-width:520px;margin:0 auto;padding:16px 16px 100px}
.header h1{font-size:22px;font-weight:700;margin-bottom:2px}
.header p{font-size:13px;color:var(--text-muted)}
.tab-bar{display:flex;gap:0;margin:20px 0;border-bottom:2px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:10px 12px;border:none;white-space:nowrap;border-bottom:2px solid transparent;background:transparent;color:var(--text-muted);font-weight:400;cursor:pointer;font-size:14px;margin-bottom:-2px}
.tab-btn.active{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.pill-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:13px;background:var(--bg-card);color:var(--text);font-weight:400}
.pill.active{background:#1a472a;color:#fff;font-weight:600}
.card{background:var(--bg-card);border-radius:8px;padding:14px;margin-bottom:10px}
.card-lg{padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-label{color:var(--text-muted)}.row-value{font-weight:500}
.label-sm{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:.5px}
.vocab-row{display:flex;justify-content:space-between;padding:10px 14px;background:var(--bg-card);border-radius:6px;cursor:pointer;user-select:none}
.vocab-row .ru{font-size:16px;font-weight:500}.vocab-row .en{font-size:15px;transition:color .15s}
.phrase-card{background:var(--bg-card);border-radius:8px;padding:12px 14px;cursor:pointer;user-select:none}
.phrase-card .ru{font-size:16px;font-weight:500;line-height:1.5}
.phrase-card .en{font-size:14px;color:var(--text-muted);overflow:hidden;transition:all .2s}
.prep-card{background:var(--bg-card);border-radius:8px;padding:14px;cursor:pointer;user-select:none}
.prep-header{display:flex;justify-content:space-between;align-items:baseline}
.prep-header .prep{font-size:16px;font-weight:600}
.prep-header .case{font-size:12px;color:var(--accent);font-weight:500}
.prep-meaning{font-size:14px;color:var(--text-muted);margin-top:2px}
.prep-example{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:4px;font-size:14px;line-height:1.6;overflow:hidden;transition:all .2s}
.prep-example .ex{font-weight:500}.prep-example .exen{color:var(--text-muted);font-size:13px}
.quiz-option{padding:12px 14px;border-radius:6px;border:2px solid transparent;background:var(--bg-card);cursor:pointer;text-align:left;font-size:15px;width:100%}
.quiz-option.correct{background:#1a472a22;border-color:#1a472a}
.quiz-option.wrong{background:#7a1a1a22;border-color:#7a1a1a}
.quiz-option.locked{cursor:default}
.btn-primary{padding:10px 24px;border-radius:6px;border:none;background:#1a472a;color:#fff;cursor:pointer;font-weight:600;width:100%}
.btn-secondary{padding:10px 20px;border-radius:6px;border:none;background:var(--bg-card);cursor:pointer}
.btn-ghost{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px}
.nav-dot{width:28px;height:28px;border-radius:4px;border:none;font-size:12px;cursor:pointer;background:var(--bg-card);color:var(--text-muted)}
.nav-dot.active{background:#1a472a;color:#fff}
</style>
</head>

function QuizSection(){
const allVocab=useMemo(()=>Object.values(VOCAB).flat(),[]);

const[qIdx,setQIdx]=useState(0);const[selected,setSelected]=useState(null);

setMode(m);setScore(0);setQIdx(0);setSelected(null);setFinished(false);setMissed([]);setIsRetry(false);
if(m==="vocab"){const sh=shuffle(allVocab).slice(0,QCOUNT);setQuestions(sh.map(w=>{const dir=Math.random()>.5?"ru2en":"en2ru";const correct=dir==="ru2en"?w.en:w.ru;const prompt=dir==="ru2en"?w.ru:w.en;const field=dir==="ru2en"?"en":"ru";const wrongs=shuffle(allVocab.filter(x=>x!==w)).slice(0,3).map(x=>x[field]);return{prompt,correct,options:shuffle([correct,...wrongs])}}))}
else if(m==="verbs"){const verbs=shuffle(VERBS.filter(v=>v.present||v.future)).slice(0,QCOUNT);const pronouns=["я","ты","он/она","мы","вы","они"];setQuestions(verbs.map(v=>{const t=v.present||v.future;const avail=pronouns.filter(p=>t[p]);const pron=avail[Math.floor(Math.random()*avail.length)];const correct=t[pron];const extras=shuffle(VERBS.filter(vv=>vv!==v&&(vv.present||vv.future))).slice(0,3).map(vv=>{const tt=vv.present||vv.future;const vals=Object.values(tt);return vals[Math.floor(Math.random()*vals.length)]});return{prompt:`${v.inf} \u2192 ${pron}`,correct,options:shuffle([correct,...extras.filter(f=>f!==correct).slice(0,3)])}}))}
else if(m==="cases"){const qs=[];for(let i=0;i<QCOUNT;i++){const c=CASES[Math.floor(Math.random()*CASES.length)];if(Math.random()>.5){const wrongs=shuffle(CASES.filter(x=>x!==c)).slice(0,3).map(x=>x.name);qs.push({prompt:`Which case answers: ${c.question}?`,correct:c.name,options:shuffle([c.name,...wrongs])})}else{const ex=c.examples[Math.floor(Math.random()*c.examples.length)];const wrongs=shuffle(CASES.filter(x=>x!==c)).slice(0,3).map(x=>x.name);qs.push({prompt:`Which case: \u201c${ex}\u201d`,correct:c.name,options:shuffle([c.name,...wrongs])})}}setQuestions(shuffle(qs))}
else if(m==="preps"){const sh=shuffle(allPreps).slice(0,QCOUNT);setQuestions(sh.map(p=>{if(Math.random()>.5){const wrongs=shuffle(allPreps.filter(x=>x!==p)).slice(0,3).map(x=>x.en);return{prompt:p.prep,correct:p.en,options:shuffle([p.en,...wrongs])}}else{const allC=["Genitive","Dative","Accusative","Instrumental","Prepositional"];const wrongs=shuffle(allC.filter(c=>c!==p.case)).slice(0,3);return{prompt:`${p.prep} takes which case?`,correct:p.case,options:shuffle([p.case,...wrongs])}}}))}
},[allVocab,allPreps]);
const startRetry=()=>{
const retryQs=missed.map(q=>({...q,options:shuffle(q.options)}));
setQuestions(retryQs);setQIdx(0);setSelected(null);setScore(0);setFinished(false);setMissed([]);setIsRetry(true);
};
const handleSelect=opt=>{if(selected!==null)return;setSelected(opt);if(opt===questions[qIdx].correct)setScore(s=>s+1);else setMissed(prev=>[...prev,questions[qIdx]])};
const next=()=>{if(qIdx+1>=questions.length)setFinished(true);else{setQIdx(qIdx+1);setSelected(null)}};
if(!mode)return e('div',null,
e('p',{style:{color:'var(--text-muted)',marginBottom:16,fontSize:14}},`${QCOUNT} questions, multiple choice. Pick a topic:`),
[{id:"vocab",label:"Vocabulary",desc:"Translate words both directions"},{id:"verbs",label:"Verb conjugations",desc:"Pick the right form for the pronoun"},{id:"cases",label:"Cases",desc:"Identify the case from questions and examples"},{id:"preps",label:"Prepositions",desc:"Meanings and which case they take"}].map(m=>e('button',{key:m.id,onClick:()=>startQuiz(m.id),style:{display:'block',width:'100%',padding:'14px 16px',marginBottom:8,borderRadius:8,border:'none',background:'var(--bg-card)',cursor:'pointer',textAlign:'left'}},e('div',{style:{fontWeight:600,fontSize:15}},m.label),e('div',{style:{fontSize:13,color:'var(--text-muted)',marginTop:2}},m.desc))));

return e('div',{style:{textAlign:'center',padding:'32px 0'}},
e('div',{style:{fontSize:40,fontWeight:700,marginBottom:4}},`${score}/${questions.length}`),
e('div',{style:{fontSize:16,color:'var(--text-muted)',marginBottom:4}},`${pct}%`),
e('div',{style:{fontSize:15,color:'var(--text-muted)',marginBottom:8}},msg),
isRetry&&pct===100?e('div',{style:{fontSize:14,color:'var(--accent)',marginBottom:16}},'All cleared!'):null,
missedCount>0?e('div',{style:{marginBottom:20}},
e('div',{style:{fontSize:13,color:'var(--text-muted)',marginBottom:10}},`${missedCount} missed:`),
e('div',{style:{display:'flex',flexDirection:'column',gap:4,textAlign:'left',marginBottom:4}},missed.map((q,i)=>
e('div',{key:i,style:{background:'var(--bg-card)',borderRadius:6,padding:'8px 12px',fontSize:14}},
e('span',{style:{color:'var(--text-muted)'}},q.prompt),
e('span',null,' \u2192 '),
e('span',{style:{fontWeight:600}},q.correct)
)))
):null,
e('div',{style:{display:'flex',flexDirection:'column',gap:8,alignItems:'center'}},
missedCount>0?e('button',{className:'btn-primary',style:{width:'auto',padding:'10px 20px'},onClick:startRetry},`Retry missed (${missedCount})`):null,
e('div',{style:{display:'flex',gap:8}},
e('button',{className:missedCount>0?'btn-secondary':'btn-primary',style:{padding:'10px 20px'},onClick:()=>startQuiz(mode)},'New round'),
e('button',{className:'btn-secondary',onClick:()=>setMode(null)},'Change topic')
))
)}
const q=questions[qIdx];
return e('div',null,
e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
e('span',{style:{fontSize:13,color:'var(--text-muted)'}},`${qIdx+1} / ${questions.length}${isRetry?' (retry)':''}`),
e('span',{style:{fontSize:13,color:'var(--text-muted)'}},`${score} correct`)),
e('div',{className:'card',style:{padding:16,marginBottom:14}},e('div',{style:{fontSize:18,fontWeight:600}},q.prompt)),
e('div',{style:{display:'flex',flexDirection:'column',gap:6}},q.options.map((opt,i)=>{let cls='quiz-option';if(selected!==null){cls+=' locked';if(opt===q.correct)cls+=' correct';else if(opt===selected)cls+=' wrong'}return e('button',{key:i,className:cls,onClick:()=>handleSelect(opt)},opt)})),
selected!==null&&e('button',{className:'btn-primary',style:{marginTop:14},onClick:next},qIdx+1>=questions.length?'See results':'Next'),
e('button',{className:'btn-ghost',style:{marginTop:8,width:'100%'},onClick:()=>{setMode(null);setSelected(null)}},'\u2190 Back to topics')
