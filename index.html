<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Русский: Crash Course</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f5f5f0;
  --bg-card: #ffffff;
  --text: #1a1a1a;
  --text-muted: #6b6b6b;
  --accent: #1a472a;
  --border: #e8e8e4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414;
    --bg-card: #1e1e1e;
    --text: #e8e8e4;
    --text-muted: #8a8a8a;
    --accent: #6dba82;
    --border: #2a2a2a;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; -webkit-appearance: none; }
#root { max-width: 520px; margin: 0 auto; padding: 16px 16px 100px; }

.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.header p { font-size: 13px; color: var(--text-muted); }

.tab-bar {
  display: flex; gap: 0; margin: 20px 0; border-bottom: 2px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; padding: 10px 12px; border: none; white-space: nowrap;
  border-bottom: 2px solid transparent; background: transparent;
  color: var(--text-muted); font-weight: 400; cursor: pointer; font-size: 14px;
  margin-bottom: -2px;
}
.tab-btn.active { border-bottom-color: var(--accent); color: var(--text); font-weight: 600; }

.pill-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pill {
  padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px;
  background: var(--bg-card); color: var(--text); font-weight: 400;
}
.pill.active { background: #1a472a; color: #fff; font-weight: 600; }

.card {
  background: var(--bg-card); border-radius: 8px; padding: 14px; margin-bottom: 10px;
}
.card-lg { padding: 16px; margin-bottom: 12px; }

.row {
  display: flex; justify-content: space-between; padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.row-label { color: var(--text-muted); }
.row-value { font-weight: 500; }

.label-sm {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px;
}

.vocab-row {
  display: flex; justify-content: space-between; padding: 10px 14px;
  background: var(--bg-card); border-radius: 6px; cursor: pointer; user-select: none;
}
.vocab-row .ru { font-size: 16px; font-weight: 500; }
.vocab-row .en { font-size: 15px; transition: color 0.15s; }

.phrase-card {
  background: var(--bg-card); border-radius: 8px; padding: 12px 14px;
  cursor: pointer; user-select: none;
}
.phrase-card .ru { font-size: 16px; font-weight: 500; line-height: 1.5; }
.phrase-card .en {
  font-size: 14px; color: var(--text-muted); overflow: hidden; transition: all 0.2s;
}

.prep-card {
  background: var(--bg-card); border-radius: 8px; padding: 14px;
  cursor: pointer; user-select: none;
}
.prep-header { display: flex; justify-content: space-between; align-items: baseline; }
.prep-header .prep { font-size: 16px; font-weight: 600; }
.prep-header .case { font-size: 12px; color: var(--accent); font-weight: 500; }
.prep-meaning { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
.prep-example {
  margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 4px;
  font-size: 14px; line-height: 1.6; overflow: hidden; transition: all 0.2s;
}
.prep-example .ex { font-weight: 500; }
.prep-example .exen { color: var(--text-muted); font-size: 13px; }

.quiz-option {
  padding: 12px 14px; border-radius: 6px; border: 2px solid transparent;
  background: var(--bg-card); cursor: pointer; text-align: left; font-size: 15px;
  width: 100%;
}
.quiz-option.correct { background: #1a472a22; border-color: #1a472a; }
.quiz-option.wrong { background: #7a1a1a22; border-color: #7a1a1a; }
.quiz-option.locked { cursor: default; }

.btn-primary {
  padding: 10px 24px; border-radius: 6px; border: none;
  background: #1a472a; color: #fff; cursor: pointer; font-weight: 600; width: 100%;
}
.btn-secondary {
  padding: 10px 20px; border-radius: 6px; border: none;
  background: var(--bg-card); cursor: pointer;
}
.btn-ghost {
  background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px;
}
.nav-dot {
  width: 28px; height: 28px; border-radius: 4px; border: none; font-size: 12px;
  cursor: pointer; background: var(--bg-card); color: var(--text-muted);
}
.nav-dot.active { background: #1a472a; color: #fff; }
</style>
</head>

    {prep:"с + instr.",en:"with",case:"Instrumental",ex:"Я пью чай с молоком.",exEn:"I drink tea with milk."},

    {prep:"перед + instr.",en:"in front of/before",case:"Instrumental",ex:"Перед домом есть сад.",exEn:"In front of the house there is a garden."},
    {prep:"между + instr.",en:"between",case:"Instrumental",ex:"Между нами.",exEn:"Between us."},
    {prep:"над + instr.",en:"above/over",case:"Instrumental",ex:"Лампа над столом.",exEn:"The lamp is above the table."},
    {prep:"под + instr.",en:"under/below",case:"Instrumental",ex:"Кошка под столом.",exEn:"The cat is under the table."},
  ]},
  {group:"About",items:[
    {prep:"о / об + prep.",en:"about",case:"Prepositional",ex:"Мы говорим о фильме.",exEn:"We are talking about a film."},
    {prep:"про + acc.",en:"about (colloquial)",case:"Accusative",ex:"Расскажи мне про свою работу.",exEn:"Tell me about your job."},
  ]},
  {group:"Time",items:[
    {prep:"в + acc.",en:"at (time); on (day)",case:"Accusative",ex:"В понедельник в два часа.",exEn:"On Monday at two o'clock."},
    {prep:"через + acc.",en:"in (after a period)",case:"Accusative",ex:"Через час.",exEn:"In an hour."},
    {prep:"назад",en:"ago (after time phrase)",case:"—",ex:"Два года назад.",exEn:"Two years ago."},
  ]},
];

const PHRASES = {
  "About me":[
    {ru:"Меня зовут...",en:"My name is..."},{ru:"Мне ... лет.",en:"I am ... years old."},
    {ru:"Я из Ирландии.",en:"I'm from Ireland."},{ru:"Я живу в Испании, в Лас-Пальмасе.",en:"I live in Spain, in Las Palmas."},
    {ru:"Я переехал сюда в ... году.",en:"I moved here in (year)."},{ru:"Я говорю по-английски, по-испански и немного по-русски.",en:"I speak English, Spanish and a bit of Russian."},
    {ru:"Я изучаю русский язык.",en:"I study Russian."},{ru:"В свободное время я ...",en:"In my free time I..."},
    {ru:"Мне нравится бегать / читать / путешествовать.",en:"I like running / reading / travelling."},
    {ru:"Я интересуюсь языками.",en:"I'm interested in languages."},
  ],
  "Family & people":[
    {ru:"У меня большая / маленькая семья.",en:"I have a big / small family."},
    {ru:"У меня есть брат / сестра.",en:"I have a brother / sister."},
    {ru:"У меня нет детей.",en:"I don't have children."},
    {ru:"Мои родители живут в ...",en:"My parents live in..."},
    {ru:"Мой брат / моя сестра работает ...",en:"My brother / sister works as..."},
    {ru:"Мы часто созваниваемся.",en:"We often call each other."},
    {ru:"Он / она старше / младше меня.",en:"He / she is older / younger than me."},
    {ru:"У меня есть собака. Её зовут ...",en:"I have a dog. Her name is..."},
  ],
  "Work & job":[
    {ru:"Я работаю в компании ...",en:"I work at the company..."},
    {ru:"Я работаю удалённо.",en:"I work remotely."},
    {ru:"Я работаю из коворкинга.",en:"I work from a co-working space."},
    {ru:"Моя работа связана с ...",en:"My work is connected with..."},
    {ru:"Я занимаюсь контентом и маркетингом.",en:"I do content and marketing."},
    {ru:"Я пишу тексты для сайтов.",en:"I write content for websites."},
    {ru:"Мне нравится моя работа, потому что ...",en:"I like my work because..."},
    {ru:"Раньше я работал в ...",en:"Before, I used to work at..."},
    {ru:"Я работаю здесь с ... года.",en:"I've been working here since (year)."},
  ],
  "Describing a photo":[
    {ru:"На фотографии я вижу ...",en:"In the photo I can see..."},
    {ru:"На переднем плане ...",en:"In the foreground..."},
    {ru:"На заднем плане ...",en:"In the background..."},
    {ru:"Слева стоит / сидит ...",en:"On the left stands / sits..."},
    {ru:"Справа находится ...",en:"On the right is..."},
    {ru:"В центре фотографии ...",en:"In the centre of the photo..."},
    {ru:"Мужчина / женщина в чёрной куртке.",en:"A man / woman in a black jacket."},
    {ru:"Они выглядят счастливыми / уставшими.",en:"They look happy / tired."},
    {ru:"Мне кажется, что это ...",en:"It seems to me that this is..."},
    {ru:"Наверное, это происходит летом / зимой.",en:"Probably this is happening in summer / winter."},
    {ru:"На улице солнечно / пасмурно.",en:"It is sunny / cloudy outside."},
    {ru:"Я думаю, что они ...",en:"I think that they..."},
  ],
  "Opinions & feelings":[
    {ru:"Мне кажется, что ...",en:"It seems to me that..."},{ru:"Я думаю, что ...",en:"I think that..."},
    {ru:"Я согласен / согласна.",en:"I agree (m/f)."},{ru:"Я не согласен / не согласна.",en:"I disagree (m/f)."},
    {ru:"Мне нравится ..., потому что ...",en:"I like ..., because..."},{ru:"Мне не нравится ...",en:"I don't like..."},
    {ru:"По-моему, ...",en:"In my opinion..."},
    {ru:"С одной стороны ... с другой стороны ...",en:"On the one hand ... on the other hand..."},
  ],
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const TABS = ["Vocab","Verbs","Cases","Preps","Phrases","Quiz"];

function VocabSection() {
  const [cat, setCat] = useState(Object.keys(VOCAB)[0]);
  const [revealed, setRevealed] = useState({});
  const toggle = i => setRevealed(r => ({...r, [i]: !r[i]}));
  const revealAll = () => { const all = {}; VOCAB[cat].forEach((_,i) => all[i] = true); setRevealed(all); };

  return e('div', null,
    e('div', {className:'pill-bar'}, Object.keys(VOCAB).map(c =>
      e('button', {key:c, className:'pill'+(c===cat?' active':''), onClick:()=>{setCat(c);setRevealed({})}}, c)
    )),
    e('div', {style:{display:'flex',justifyContent:'flex-end',marginBottom:8}},
      e('button', {className:'btn-ghost', onClick:revealAll}, 'Reveal all')
    ),
    e('div', {style:{display:'flex',flexDirection:'column',gap:4}},
      VOCAB[cat].map((w,i) =>
        e('div', {key:i, className:'vocab-row', onClick:()=>toggle(i)},
          e('span', {className:'ru'}, w.ru),
          e('span', {className:'en', style:{color:revealed[i]?'var(--text)':'transparent'}}, w.en)
        )
      )
    )
  );
}

function VerbSection() {
  const [idx, setIdx] = useState(0);
  const v = VERBS[idx];
  const compoundFuture = {"я":"буду","ты":"будешь","он/она":"будет","мы":"будем","вы":"будете","они":"будут"};

  return e('div', null,
    e('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}},
      e('button', {className:'btn-secondary', disabled:idx===0, onClick:()=>setIdx(idx-1), style:{opacity:idx===0?0.3:1}}, '←'),
      e('span', {style:{fontSize:13,color:'var(--text-muted)'}}, `${idx+1} / ${VERBS.length}`),
      e('button', {className:'btn-secondary', disabled:idx===VERBS.length-1, onClick:()=>setIdx(idx+1), style:{opacity:idx===VERBS.length-1?0.3:1}}, '→'),
    ),
    e('div', {className:'card card-lg'},
      e('div', {style:{fontSize:22,fontWeight:600,marginBottom:2}}, v.inf),
      e('div', {style:{fontSize:15,color:'var(--text-muted)',marginBottom:4}}, `${v.en} · ${v.aspect==='impf'?'imperfective':'perfective'}`),
      e('div', {style:{fontSize:13,color:'var(--accent)',lineHeight:1.5}}, v.note),
    ),
    v.present && e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Present'),
      ...Object.entries(v.present).map(([p,f]) =>
        e('div', {key:p, className:'row'}, e('span',{className:'row-label'},p), e('span',{className:'row-value'},f))
      )
    ),
    v.aspect === 'impf' && v.inf !== 'быть' ? e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Future (compound)'),
      ...Object.entries(compoundFuture).map(([p,f]) =>
        e('div', {key:p, className:'row'}, e('span',{className:'row-label'},p), e('span',{className:'row-value'},`${f} ${v.inf}`))
      )
    ) : null,
    v.future ? e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Future (perfective)'),
      ...Object.entries(v.future).map(([p,f]) =>
        e('div', {key:p, className:'row'}, e('span',{className:'row-label'},p), e('span',{className:'row-value'},f))
      )
    ) : null,
    v.inf === 'быть' ? e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Future'),
      ...Object.entries(compoundFuture).map(([p,f]) =>
        e('div', {key:p, className:'row'}, e('span',{className:'row-label'},p), e('span',{className:'row-value'},f))
      )
    ) : null,
    e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Past'),
      ...Object.entries(v.past).map(([g,f]) =>
        e('div', {key:g, className:'row'}, e('span',{className:'row-label'},g), e('span',{className:'row-value'},f))
      )
    ),
    e('div', {style:{display:'flex',flexWrap:'wrap',gap:4,marginTop:14}},
      VERBS.map((_,i) => e('button', {key:i, className:'nav-dot'+(i===idx?' active':''), onClick:()=>setIdx(i)}, i+1))
    )
  );
}

function CaseSection() {
  const [idx, setIdx] = useState(0);
  const c = CASES[idx];
  return e('div', null,
    e('div', {className:'pill-bar'}, CASES.map((cs,i) =>
      e('button', {key:i, className:'pill'+(i===idx?' active':''), onClick:()=>setIdx(i)}, cs.name)
    )),
    e('div', {className:'card card-lg'},
      e('div', {style:{fontSize:20,fontWeight:600}}, c.name),
      e('div', {style:{fontSize:15,color:'var(--text-muted)'}}, `${c.ru} · ${c.question}`),
      e('div', {style:{marginTop:10,fontSize:14,lineHeight:1.6}}, c.use),
    ),
    e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Typical endings'),
      ...Object.entries(c.endings).map(([t,end]) =>
        e('div', {key:t, className:'row'}, e('span',{className:'row-label',style:{fontSize:13}},t), e('span',{className:'row-value',style:{fontFamily:'monospace'}},end))
      )
    ),
    e('div', {className:'card'},
      e('div', {className:'label-sm'}, 'Examples'),
      ...c.examples.map((ex,i) =>
        e('div', {key:i, style:{padding:'6px 0',fontSize:15,borderBottom:i<c.examples.length-1?'1px solid var(--border)':'none'}}, ex)
      )
    ),
  );
}

function PrepositionSection() {
  const [gi, setGi] = useState(0);
  const [revealed, setRevealed] = useState({});
  const group = PREPOSITIONS[gi];
  const toggle = i => setRevealed(r => ({...r, [i]: !r[i]}));

  return e('div', null,
    e('div', {className:'pill-bar'}, PREPOSITIONS.map((g,i) =>
      e('button', {key:i, className:'pill'+(i===gi?' active':''), onClick:()=>{setGi(i);setRevealed({})}}, g.group)
    )),
    e('div', {style:{display:'flex',flexDirection:'column',gap:8}},
      group.items.map((item,i) =>
        e('div', {key:i, className:'prep-card', onClick:()=>toggle(i)},
          e('div', {className:'prep-header'},
            e('span', {className:'prep'}, item.prep),
            e('span', {className:'case'}, item.case),
          ),
          e('div', {className:'prep-meaning'}, item.en),
          e('div', {className:'prep-example', style:{maxHeight:revealed[i]?100:0,opacity:revealed[i]?1:0,marginTop:revealed[i]?8:0,padding:revealed[i]?'8px 10px':'0 10px'}},
            e('div', {className:'ex'}, item.ex),
            e('div', {className:'exen'}, item.exEn),
          ),
        )
      )
    )
  );
}

function PhrasesSection() {
  const [cat, setCat] = useState(Object.keys(PHRASES)[0]);
  const [revealed, setRevealed] = useState({});
  const toggle = i => setRevealed(r => ({...r, [i]: !r[i]}));

  return e('div', null,
    e('div', {className:'pill-bar'}, Object.keys(PHRASES).map(c =>
      e('button', {key:c, className:'pill'+(c===cat?' active':''), onClick:()=>{setCat(c);setRevealed({})}}, c)
    )),
    e('p', {style:{fontSize:13,color:'var(--text-muted)',marginBottom:12}}, 'Tap to reveal the English.'),
    e('div', {style:{display:'flex',flexDirection:'column',gap:6}},
      PHRASES[cat].map((p,i) =>
        e('div', {key:i, className:'phrase-card', onClick:()=>toggle(i)},
          e('div', {className:'ru'}, p.ru),
          e('div', {className:'en', style:{maxHeight:revealed[i]?60:0,opacity:revealed[i]?1:0,marginTop:revealed[i]?6:0}}, p.en),
        )
      )
    )
  );
}

function QuizSection() {
  const allVocab = useMemo(() => Object.values(VOCAB).flat(), []);
  const allPreps = useMemo(() => PREPOSITIONS.flatMap(g => g.items), []);
  const [mode, setMode] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [finished, setFinished] = useState(false);
  const QCOUNT = 15;

  const startQuiz = useCallback(m => {
    setMode(m); setScore(0); setQIdx(0); setSelected(null); setFinished(false);
    if (m === "vocab") {
      const shuffled = shuffle(allVocab).slice(0, QCOUNT);
      setQuestions(shuffled.map(w => {
        const dir = Math.random() > 0.5 ? "ru2en" : "en2ru";
        const correct = dir === "ru2en" ? w.en : w.ru;
        const prompt = dir === "ru2en" ? w.ru : w.en;
        const field = dir === "ru2en" ? "en" : "ru";
        const wrongs = shuffle(allVocab.filter(x => x !== w)).slice(0,3).map(x => x[field]);
        return {prompt, correct, options: shuffle([correct, ...wrongs])};
      }));
    } else if (m === "verbs") {
      const verbs = shuffle(VERBS.filter(v => v.present || v.future)).slice(0, QCOUNT);
      const pronouns = ["я","ты","он/она","мы","вы","они"];
      setQuestions(verbs.map(v => {
        const t = v.present || v.future;
        const avail = pronouns.filter(p => t[p]);
        const pron = avail[Math.floor(Math.random() * avail.length)];
        const correct = t[pron];
        const extras = shuffle(VERBS.filter(vv => vv !== v && (vv.present || vv.future))).slice(0,3).map(vv => {
          const tt = vv.present || vv.future; const vals = Object.values(tt);
          return vals[Math.floor(Math.random() * vals.length)];
        });
        return {prompt:`${v.inf} → ${pron}`, correct, options: shuffle([correct, ...extras.filter(f=>f!==correct).slice(0,3)])};
      }));
    } else if (m === "cases") {
      const qs = [];
      for (let i = 0; i < QCOUNT; i++) {
        const c = CASES[Math.floor(Math.random() * CASES.length)];
        if (Math.random() > 0.5) {
          const wrongs = shuffle(CASES.filter(x=>x!==c)).slice(0,3).map(x=>x.name);
          qs.push({prompt:`Which case answers: ${c.question}?`, correct:c.name, options:shuffle([c.name,...wrongs])});
        } else {
          const ex = c.examples[Math.floor(Math.random()*c.examples.length)];
          const wrongs = shuffle(CASES.filter(x=>x!==c)).slice(0,3).map(x=>x.name);
          qs.push({prompt:`Which case: "${ex}"`, correct:c.name, options:shuffle([c.name,...wrongs])});
        }
      }
      setQuestions(shuffle(qs));
    } else if (m === "preps") {
      const shuffled = shuffle(allPreps).slice(0, QCOUNT);
      setQuestions(shuffled.map(p => {
        if (Math.random() > 0.5) {
          const wrongs = shuffle(allPreps.filter(x=>x!==p)).slice(0,3).map(x=>x.en);
          return {prompt:p.prep, correct:p.en, options:shuffle([p.en,...wrongs])};
        } else {
          const allC = ["Genitive","Dative","Accusative","Instrumental","Prepositional"];
          const wrongs = shuffle(allC.filter(c=>c!==p.case)).slice(0,3);
          return {prompt:`${p.prep} takes which case?`, correct:p.case, options:shuffle([p.case,...wrongs])};
        }
      }));
    }
  }, [allVocab, allPreps]);

  const handleSelect = opt => {
    if (selected !== null) return;
    setSelected(opt);
    if (opt === questions[qIdx].correct) setScore(s => s + 1);
  };

  const next = () => {
    if (qIdx + 1 >= questions.length) setFinished(true);
    else { setQIdx(qIdx + 1); setSelected(null); }
  };

  if (!mode) {
    return e('div', null,
      e('p', {style:{color:'var(--text-muted)',marginBottom:16,fontSize:14}}, `${QCOUNT} questions, multiple choice. Pick a topic:`),
      [{id:"vocab",label:"Vocabulary",desc:"Translate words both directions"},
       {id:"verbs",label:"Verb conjugations",desc:"Pick the right form for the pronoun"},
       {id:"cases",label:"Cases",desc:"Identify the case from questions and examples"},
       {id:"preps",label:"Prepositions",desc:"Meanings and which case they take"},
      ].map(m => e('button', {key:m.id, onClick:()=>startQuiz(m.id),
        style:{display:'block',width:'100%',padding:'14px 16px',marginBottom:8,borderRadius:8,border:'none',background:'var(--bg-card)',cursor:'pointer',textAlign:'left'}},
        e('div', {style:{fontWeight:600,fontSize:15}}, m.label),
        e('div', {style:{fontSize:13,color:'var(--text-muted)',marginTop:2}}, m.desc),
      ))
    );
  }

  if (finished) {
    const pct = Math.round((score / questions.length) * 100);
    const msg = pct >= 90 ? "Solid." : pct >= 70 ? "Getting there. Run it again." : pct >= 50 ? "Some gaps. Review and retry." : "Worth going back to the reference sections.";
    return e('div', {style:{textAlign:'center',padding:'32px 0'}},
      e('div', {style:{fontSize:40,fontWeight:700,marginBottom:4}}, `${score}/${questions.length}`),
      e('div', {style:{fontSize:16,color:'var(--text-muted)',marginBottom:4}}, `${pct}%`),
      e('div', {style:{fontSize:15,color:'var(--text-muted)',marginBottom:20}}, msg),
      e('div', {style:{display:'flex',gap:8,justifyContent:'center'}},
        e('button', {className:'btn-primary', style:{width:'auto',padding:'10px 20px'}, onClick:()=>startQuiz(mode)}, 'Again'),
        e('button', {className:'btn-secondary', onClick:()=>setMode(null)}, 'Change topic'),
      )
    );
  }

  const q = questions[qIdx];
  return e('div', null,
    e('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
      e('span', {style:{fontSize:13,color:'var(--text-muted)'}}, `${qIdx+1} / ${questions.length}`),
      e('span', {style:{fontSize:13,color:'var(--text-muted)'}}, `${score} correct`),
    ),
    e('div', {className:'card', style:{padding:16,marginBottom:14}},
      e('div', {style:{fontSize:18,fontWeight:600}}, q.prompt),
    ),
    e('div', {style:{display:'flex',flexDirection:'column',gap:6}},
      q.options.map((opt,i) => {
        let cls = 'quiz-option';
        if (selected !== null) {
          cls += ' locked';
          if (opt === q.correct) cls += ' correct';
          else if (opt === selected) cls += ' wrong';
        }
        return e('button', {key:i, className:cls, onClick:()=>handleSelect(opt)}, opt);
      })
    ),
    selected !== null && e('button', {className:'btn-primary', style:{marginTop:14}, onClick:next},
      qIdx + 1 >= questions.length ? 'See results' : 'Next'
    ),
    e('button', {className:'btn-ghost', style:{marginTop:8,width:'100%'}, onClick:()=>{setMode(null);setSelected(null)}}, '← Back to topics'),
  );
}

function App() {
  const [tab, setTab] = useState(0);
  return e('div', {id:'root-inner'},
    e('div', {className:'header', style:{marginBottom:20}},
      e('h1', null, 'Русский: Crash Course'),
      e('p', null, 'Prueba de nivel prep'),
    ),
    e('div', {className:'tab-bar'},
      TABS.map((t,i) => e('button', {key:t, className:'tab-btn'+(i===tab?' active':''), onClick:()=>setTab(i)}, t))
    ),
    tab === 0 && e(VocabSection),
    tab === 1 && e(VerbSection),
    tab === 2 && e(CaseSection),
    tab === 3 && e(PrepositionSection),
    tab === 4 && e(PhrasesSection),
    tab === 5 && e(QuizSection),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
